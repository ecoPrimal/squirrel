[workspace]
resolver = "2"
members = [
    # Main application
    "crates/main",

    # Core components
    "crates/core/interfaces",
    "crates/core/context",
    "crates/core/mcp",
    "crates/core/auth",

    # Service components
    "crates/services/commands",

    # Tool components
    "crates/tools/ai-tools",
    "crates/tools/cli",

    # Configuration
    "crates/config",

    # Universal
    "crates/universal-patterns",
    "crates/universal-constants",
    "crates/universal-error",

    # Membrane lens (portable MCP server)
    "membrane-lens-rs",

    # Pipeline binary (replaces scan_sweep_sort.py)
    "crates/scan-sweep-sort",
]

[workspace.package]
authors = ["ecoPrimals Contributors"]
edition = "2024"
license = "AGPL-3.0-or-later"
version = "0.1.0"
homepage = "https://sporeprint.primals.eco"
documentation = "https://sporeprint.primals.eco/lab/"

[workspace.dependencies]
# Core dependencies - shared across workspace
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "signal", "process"] }
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
futures = "0.3"
tracing = { version = "0.1", features = ["log"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# reqwest removed (stadial gate: Tower Atomic — HTTP goes through Songbird mesh via IPC)
url = "2.5"

# Additional common dependencies
bytes = { version = "1.5", features = ["serde"] }
regex = "1.10"
serde_yaml_ng = "0.10"
dashmap = "5.5"

# More common dependencies
rand = "0.9"
base64 = "0.22"
# POSIX helpers without `nix` (libc FFI): rustix uses linux-raw / scoped backends.
rustix = { version = "1.1", default-features = false, features = ["std", "process", "system", "fs"] }

# Storage and additional dependencies
tracing-subscriber = "0.3"

# Security and additional deps
zeroize = { version = "1.7", features = ["zeroize_derive"] }
blake3 = { version = "1.5", default-features = false, features = ["pure"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
getrandom = { version = "0.3", default-features = false, features = ["std"] }
# axum/tower: optional HTTP API surface (feature-gated, off by default). Declared below.

# CLI and command dependencies
clap = { version = "4.4", features = ["derive"] }
strum = { version = "0.27", features = ["derive"] }

# gRPC (prost/tonic) not used — ecoPrimals uses JSON-RPC + tarpc

# Dev and test dependencies
tokio-test = "0.4"
tempfile = "3.8"
pretty_assertions = "1.4"
proptest = "1.10.0"
temp-env = "0.3"
serial_test = "3.0"
insta = "1.34"

# Benchmarking dependencies
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

# RPC / transport (main + mcp)
tokio-util = { version = "0.7.17", features = ["codec"] }
tarpc = { version = "0.37", features = ["serde-transport", "unix"] }
tokio-serde = { version = "0.9", features = ["bincode"] }
# bincode 1.x: production use is transitive via tokio-serde; direct dep is dev/test only (squirrel crate)
bincode = "1.3"
toml = "0.8"
dirs = "5.0"
# tower/tower-http: REMOVED — HTTP middleware moves to Songbird mesh via IPC

# mcp-specific externals
serde_bytes = "0.11"
# tokio-tungstenite: REMOVED — Tower Atomic pattern; WebSocket provided by Songbird service mesh via IPC
# zstd/flate2/lz4_flex: REMOVED — CompressionFormat is metadata-only (no codec wired).
# Eliminates zstd-sys (C dep) from --all-features builds. Re-add when codecs are implemented.

# Internal crate dependencies
squirrel-ai-tools = { path = "crates/tools/ai-tools", version = "0.1.0" }
squirrel-mcp-config = { path = "crates/config", version = "0.1.0" }
squirrel-interfaces = { path = "crates/core/interfaces", version = "0.1.0" }
squirrel-context = { path = "crates/core/context", version = "0.1.0" }
universal-patterns = { path = "crates/universal-patterns", version = "0.1.0" }
universal-constants = { path = "crates/universal-constants", version = "0.1.0" }
universal-error = { path = "crates/universal-error", version = "0.1.0" }
squirrel-mcp = { path = "crates/core/mcp", version = "0.1.0" }
squirrel-mcp-auth = { path = "crates/core/auth", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_imports = "warn"
unused_variables = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
missing_docs_in_private_items = "allow"
module_name_repetitions = "allow"
missing_panics_doc = "allow"