[package]
name = "squirrel"
version = "0.1.0"
edition = "2024"
authors = ["ecoPrimals Contributors"]
license = "AGPL-3.0-or-later"
description = "Squirrel Universal AI Primal - Main coordination primal"
repository = "https://github.com/ecoPrimals/squirrel"
keywords = ["ecoprimals", "ai", "mcp", "json-rpc"]
default-run = "squirrel"
categories = ["development-tools"]

[dependencies]
# CLI framework for UniBin architecture
clap = { workspace = true, features = ["cargo", "wrap_help"] }

tokio.workspace = true
tokio-util.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
toml.workspace = true
dirs.workspace = true
uuid = { workspace = true, features = ["v4"] }
url.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow.workspace = true
thiserror.workspace = true
dashmap.workspace = true

# HTTP framework REMOVED - Squirrel uses Unix sockets + JSON-RPC + tarpc
# All external HTTP is proxied via ecosystem capability routing (own IPC client)
base64.workspace = true
rand.workspace = true
futures.workspace = true
# lazy_static removed - evolved to std::sync::LazyLock (stable Rust 1.80+)

# Text processing and validation (CRITICAL FIX: Missing regex dependency)
regex.workspace = true

# JSON-RPC: Using manual implementation (BearDog pattern) - ZERO C dependencies!
# jsonrpsee removed - it pulls ring via rustls
# hostname/nix: consolidated into universal_constants::sys_info (pure Rust on Linux)

# tarpc for high-performance RPC (Phase 2) - Fixed with correct versions from Songbird/BearDog
tarpc = { workspace = true, optional = true }
tokio-serde = { workspace = true, optional = true }

# NOTE: Service mesh dependencies discovered at runtime via capability registry.
# No compile-time primal dependencies needed (TRUE PRIMAL architecture).
# Squirrel knows only itself; other primals are discovered dynamically via Unix sockets.

# Canonical ecosystem types from cellMembrane
cellmembrane-types.workspace = true

# Configuration management
squirrel-mcp-config.workspace = true

# Authentication system (CRITICAL FIX: Missing auth dependency)
squirrel-mcp-auth.workspace = true

# Optional local auth crates for development

# Universal patterns
universal-patterns.workspace = true
universal-constants.workspace = true
# ecosystem-api: EXCISED (C8 — upstream absorption)
zeroize.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true

# Context management
squirrel-context.workspace = true

# MCP and AI dependencies
# Using our own MCP implementation instead of external mcp crate
squirrel-mcp.workspace = true
# OpenAI SDK - OPTIONAL in v1.1.0+ (dev-direct-http feature only!)
# openai REMOVED - Use capability_ai (delegates to Songbird via Unix sockets) instead!


# Benchmarking (optional)
criterion = { workspace = true, optional = true }

# gRPC REMOVED - NOT ecoPrimals standard!
# ecoPrimals uses JSON-RPC + tarpc (full Rust ecosystem)
# tonic REMOVED - gRPC is NOT our protocol
# prost REMOVED - protobuf NOT needed (use serde_json!)

[features]
# Production default: Core RPC + Ecosystem (100% Pure Rust!)
# NO monitoring (optional - pulls hyper via prometheus)
# NO dev-direct-http (DELETED - use Unix socket delegation!)
default = ["tarpc-rpc"]

# Core features (TRUE PRIMAL architecture)
tarpc-rpc = ["tarpc", "tokio-serde"]  # High-performance binary RPC (bincode via tokio-serde)

# Optional features
system-metrics = []  # Uses universal_constants::sys_info (pure Rust, /proc on Linux)
monitoring = []  # Self-contained Prometheus exposition format in exporters.rs
benchmarking = ["criterion"]             # Benchmarking tools
## enhanced_error_handling / optimizations removed — no cfg(feature) references;
## error handling and optimizations are always-on via workspace lint policy.
# gpu-detection: excised Wave 157g — GPU detection belongs to compute primals (ToadStool/barraCuda)

[dev-dependencies]
bincode.workspace = true  # test-only serialize/deserialize roundtrips (production uses tokio-serde)
tokio-test.workspace = true
tempfile.workspace = true
temp-env.workspace = true
pretty_assertions.workspace = true
serial_test.workspace = true
proptest.workspace = true  # Property-based testing (groundSpring/wetSpring pattern)

[[bin]]
name = "squirrel"
path = "src/main.rs"

[[bench]]
name = "ecosystem_benchmarks"
harness = false
required-features = ["benchmarking"]

[lib]
name = "squirrel"
path = "src/lib.rs" 

[lints]
workspace = true
