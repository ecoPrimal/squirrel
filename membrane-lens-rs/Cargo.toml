[package]
name = "membrane-lens"
version = "1.0.0"
edition = "2021"
description = "Portable MCP server for seeing inside the membrane. Zero runtime deps beyond stdlib + TLS."
license = "AGPL-3.0-or-later"

[[bin]]
name = "membrane-lens"
path = "src/main.rs"

[dependencies]
# Minimal — only what we need for HTTPS + JSON over stdio
ureq = { version = "2", features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
opt-level = "z"
